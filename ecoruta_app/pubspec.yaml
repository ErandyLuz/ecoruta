name: ecoruta
description: EcoRuta - app móvil para consultar y registrar acciones ecológicas.
publish_to: "none"
version: 0.9.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Nube: autenticación remota y base de datos
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # Seguridad: llave guardada en Keystore (Android) / Keychain (iOS) y cifrado AES-GCM
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  # API de terceros (Open-Meteo, calidad del aire) y abrir el videojuego
  http: ^1.2.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
